<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星の軌跡シミュレーター（透過エクスポート対応版）</title>
    <style>
      :root {
        /* 画面表示用の背景色（ダウンロード時は無視されます） */
        --bg-color: #0a1128;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background-color 0.2s;
      }

      canvas {
        display: block;
        width: 100vmin;
        height: 100vmin;
        max-width: 100vh;
        max-height: 100vh;
        z-index: 1;
        /* キャンバス自体を透過させて、背後のbodyの色を透過表示する */
        background: transparent;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      }

      /* コントロールパネル */
      .controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(10, 20, 40, 0.85);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 10;
        width: 300px;
        max-height: 90vh;
        overflow-y: auto;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .control-group {
        margin-bottom: 12px;
      }

      .color-pickers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }

      .color-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 0.8rem;
        color: #cbd5e1;
      }

      .color-item input[type="color"] {
        width: 100%;
        height: 35px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
      }

      .control-group label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 3px;
        color: #cbd5e1;
      }

      .control-group input[type="range"] {
        width: 100%;
        margin-bottom: 3px;
      }

      .value-display {
        float: right;
        font-weight: bold;
        color: #38bdf8;
      }

      h3 {
        margin: 0 0 15px 0;
        font-size: 1.1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 5px;
        color: #f1f5f9;
      }

      /* ボタン共通スタイル */
      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        font-size: 0.95rem;
        cursor: pointer;
        transition:
          transform 0.1s,
          filter 0.2s;
        margin-bottom: 10px;
      }

      .btn:hover {
        filter: brightness(1.1);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-regenerate {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
      }

      .btn-download {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h3>軌跡パラメーター</h3>

      <button class="btn btn-regenerate" id="btn-regen">ランダム再生成</button>
      <button class="btn btn-download" id="btn-download">
        透過画像として保存
      </button>

      <div class="color-pickers">
        <div class="color-item">
          <label for="color-bg">確認用背景色</label>
          <input type="color" id="color-bg" value="#0a1128" />
        </div>
        <div class="color-item">
          <label for="color-trail">軌跡の色</label>
          <input type="color" id="color-trail" value="#b4e6ff" />
        </div>
      </div>

      <div class="control-group">
        <label
          >軌跡の本数: <span id="count-val" class="value-display"></span
        ></label>
        <input type="range" id="count" min="5" max="100" value="50" />
      </div>

      <div class="control-group">
        <label
          >中心からの距離（平均 px）:
          <span id="rad-avg-val" class="value-display"></span
        ></label>
        <input type="range" id="rad-avg" min="20" max="1200" value="500" />
      </div>

      <div class="control-group">
        <label
          >中心からの距離（分散）:
          <span id="rad-var-val" class="value-display"></span
        ></label>
        <input type="range" id="rad-var" min="0" max="800" value="250" />
      </div>

      <div class="control-group">
        <label
          >弧の長さ（平均 度）:
          <span id="len-avg-val" class="value-display"></span
        ></label>
        <input type="range" id="len-avg" min="5" max="180" value="60" />
      </div>

      <div class="control-group">
        <label
          >弧の長さ（分散）: <span id="len-var-val" class="value-display"></span
        ></label>
        <input type="range" id="len-var" min="0" max="90" value="30" />
      </div>

      <div class="control-group">
        <label
          >太さ（平均 px）:
          <span id="thick-avg-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="thick-avg"
          min="1"
          max="20"
          step="0.5"
          value="3"
        />
      </div>

      <div class="control-group">
        <label
          >太さ（分散）: <span id="thick-var-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="thick-var"
          min="0"
          max="10"
          step="0.5"
          value="1.5"
        />
      </div>

      <div class="control-group">
        <label
          >不透明度（平均）:
          <span id="opac-avg-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="opac-avg"
          min="0.1"
          max="1.0"
          step="0.01"
          value="0.8"
        />
      </div>

      <div class="control-group">
        <label
          >不透明度（分散）:
          <span id="opac-var-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="opac-var"
          min="0"
          max="0.5"
          step="0.01"
          value="0.2"
        />
      </div>

      <div class="control-group">
        <label
          >中心のブレ（分散 px）:
          <span id="center-var-val" class="value-display"></span
        ></label>
        <input type="range" id="center-var" min="0" max="200" value="40" />
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const SIZE = 2000;
      canvas.width = SIZE;
      canvas.height = SIZE;

      const inputs = {
        count: document.getElementById("count"),
        radAvg: document.getElementById("rad-avg"),
        radVar: document.getElementById("rad-var"),
        lenAvg: document.getElementById("len-avg"),
        lenVar: document.getElementById("len-var"),
        thickAvg: document.getElementById("thick-avg"),
        thickVar: document.getElementById("thick-var"),
        opacAvg: document.getElementById("opac-avg"),
        opacVar: document.getElementById("opac-var"),
        centerVar: document.getElementById("center-var"),
      };

      const colorBg = document.getElementById("color-bg");
      const colorTrail = document.getElementById("color-trail");
      const btnRegen = document.getElementById("btn-regen");
      const btnDownload = document.getElementById("btn-download");

      let stars = [];

      function randomNormal(mean, stdDev) {
        let u = 0,
          v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        const num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        return num * stdDev + mean;
      }

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result
          ? {
              r: parseInt(result[1], 16),
              g: parseInt(result[2], 16),
              b: parseInt(result[3], 16),
            }
          : { r: 255, g: 255, b: 255 };
      }

      function generateStars() {
        stars = [];
        const count = parseInt(inputs.count.value);

        const radAvg = parseFloat(inputs.radAvg.value);
        const radVar = parseFloat(inputs.radVar.value);
        const lenAvg = (parseFloat(inputs.lenAvg.value) * Math.PI) / 180;
        const lenVar = (parseFloat(inputs.lenVar.value) * Math.PI) / 180;
        const thickAvg = parseFloat(inputs.thickAvg.value);
        const thickVar = parseFloat(inputs.thickVar.value);
        const opacAvg = parseFloat(inputs.opacAvg.value);
        const opacVar = parseFloat(inputs.opacVar.value);
        const centerVar = parseFloat(inputs.centerVar.value);

        const baseCenterX = SIZE / 2;
        const baseCenterY = SIZE / 2;

        for (let i = 0; i < count; i++) {
          const cx = randomNormal(baseCenterX, centerVar);
          const cy = randomNormal(baseCenterY, centerVar);
          const radius = Math.max(10, randomNormal(radAvg, radVar));
          const startAngle = Math.random() * Math.PI * 2;
          const arcLength = Math.max(0.01, randomNormal(lenAvg, lenVar));
          const endAngle = startAngle + arcLength;
          const thickness = Math.max(0.2, randomNormal(thickAvg, thickVar));

          let opacity = randomNormal(opacAvg, opacVar);
          opacity = Math.max(0.0, Math.min(1.0, opacity));

          stars.push({
            cx,
            cy,
            radius,
            startAngle,
            endAngle,
            thickness,
            opacity,
          });
        }
      }

      function draw() {
        // 【重要】Canvas内を背景色で塗りつぶさず、クリア(消去)するだけにします。
        // これにより、Canvas内部は完全に「透明」になります。
        ctx.clearRect(0, 0, SIZE, SIZE);

        // 画面確認用の背景色はCSS（bodyの背景）にのみ適用
        document.documentElement.style.setProperty("--bg-color", colorBg.value);

        const rgb = hexToRgb(colorTrail.value);

        stars.forEach((star) => {
          ctx.beginPath();
          ctx.arc(
            star.cx,
            star.cy,
            star.radius,
            star.startAngle,
            star.endAngle
          );
          ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${star.opacity})`;
          ctx.lineWidth = star.thickness;
          ctx.lineCap = "round";
          ctx.stroke();
        });
      }

      function updateLabels() {
        document.getElementById("count-val").innerText = inputs.count.value;
        document.getElementById("rad-avg-val").innerText =
          inputs.radAvg.value + " px";
        document.getElementById("rad-var-val").innerText = inputs.radVar.value;
        document.getElementById("len-avg-val").innerText =
          inputs.lenAvg.value + "°";
        document.getElementById("len-var-val").innerText = inputs.lenVar.value;
        document.getElementById("thick-avg-val").innerText =
          inputs.thickAvg.value + " px";
        document.getElementById("thick-var-val").innerText =
          inputs.thickVar.value;
        document.getElementById("opac-avg-val").innerText =
          inputs.opacAvg.value;
        document.getElementById("opac-var-val").innerText =
          inputs.opacVar.value;
        document.getElementById("center-var-val").innerText =
          inputs.centerVar.value + " px";
      }

      // ダウンロード処理
      function downloadCanvas() {
        // canvasの内容を透過データ(image/png)のURLに変換
        const link = document.createElement("a");
        link.download = "star_trails_transparent.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      Object.values(inputs).forEach((input) => {
        input.addEventListener("input", () => {
          updateLabels();
          generateStars();
          draw();
        });
      });

      // 変更をリアルタイム反映
      colorBg.addEventListener("input", draw);
      colorTrail.addEventListener("input", draw);
      btnRegen.addEventListener("click", () => {
        generateStars();
        draw();
      });

      // ダウンロードボタンのバインド
      btnDownload.addEventListener("click", downloadCanvas);

      // 初期セットアップ
      updateLabels();
      generateStars();
      draw();
    </script>
  </body>
</html>
