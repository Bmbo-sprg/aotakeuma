<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ノード接続シミュレーター（透过PNGエクスポート対応版）</title>
    <style>
      :root {
        /* 画面表示用の背景色（ダウンロード時は無視されます） */
        --bg-color: #0a1128;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background-color 0.2s;
      }

      canvas {
        display: block;
        width: 100vmin;
        height: 100vmin;
        max-width: 100vh;
        max-height: 100vh;
        z-index: 1;
        /* キャンバス自体を透過させて、背後のbodyの色を透過表示する */
        background: transparent;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      }

      /* コントロールパネル */
      .controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(10, 20, 40, 0.85);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 10;
        width: 300px;
        max-height: 90vh;
        overflow-y: auto;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .control-group {
        margin-bottom: 12px;
      }

      .color-pickers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }

      .color-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 0.8rem;
        color: #cbd5e1;
      }

      .color-item input[type="color"] {
        width: 100%;
        height: 35px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
      }

      .control-group label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 3px;
        color: #cbd5e1;
      }

      .control-group input[type="range"] {
        width: 100%;
        margin-bottom: 3px;
      }

      .value-display {
        float: right;
        font-weight: bold;
        color: #38bdf8;
      }

      h3 {
        margin: 0 0 15px 0;
        font-size: 1.1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 5px;
        color: #f1f5f9;
      }

      /* ボタン共通スタイル */
      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        font-size: 0.95rem;
        cursor: pointer;
        transition:
          transform 0.1s,
          filter 0.2s;
        margin-bottom: 10px;
      }

      .btn:hover {
        filter: brightness(1.1);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-regenerate {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
      }

      .btn-download {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h3>ノード接続パラメーター</h3>

      <button class="btn btn-regenerate" id="btn-regen">ランダム再生成</button>
      <button class="btn btn-download" id="btn-download">
        透過画像として保存
      </button>

      <div class="color-pickers">
        <div class="color-item">
          <label for="color-bg">確認用背景色</label>
          <input type="color" id="color-bg" value="#0a1128" />
        </div>
        <div class="color-item">
          <label for="color-node">ノード・線の色</label>
          <input type="color" id="color-node" value="#ffeb3b" />
        </div>
      </div>

      <div class="control-group">
        <label
          >ノード数: <span id="count-val" class="value-display"></span
        ></label>
        <input type="range" id="count" min="10" max="200" value="50" />
      </div>

      <div class="control-group">
        <label
          >最大接続距離（px）:
          <span id="dist-max-val" class="value-display"></span
        ></label>
        <input type="range" id="dist-max" min="50" max="1000" value="300" />
      </div>

      <div class="control-group">
        <label
          >ノードの位置ばらつき（分散）:
          <span id="pos-var-val" class="value-display"></span
        ></label>
        <input type="range" id="pos-var" min="10" max="1000" value="300" />
      </div>

      <div class="control-group">
        <label
          >ノードの太さ（平均 px）:
          <span id="node-thick-avg-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="node-thick-avg"
          min="1"
          max="20"
          step="0.5"
          value="5"
        />
      </div>

      <div class="control-group">
        <label
          >線の太さ（平均 px）:
          <span id="line-thick-avg-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="line-thick-avg"
          min="0.5"
          max="10"
          step="0.5"
          value="2"
        />
      </div>

      <div class="control-group">
        <label
          >不透明度（平均）:
          <span id="opac-avg-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="opac-avg"
          min="0.1"
          max="1.0"
          step="0.01"
          value="0.8"
        />
      </div>

      <div class="control-group">
        <label
          >不透明度（分散）:
          <span id="opac-var-val" class="value-display"></span
        ></label>
        <input
          type="range"
          id="opac-var"
          min="0"
          max="0.5"
          step="0.01"
          value="0.1"
        />
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const SIZE = 2000;
      canvas.width = SIZE;
      canvas.height = SIZE;

      const inputs = {
        count: document.getElementById("count"),
        distMax: document.getElementById("dist-max"),
        posVar: document.getElementById("pos-var"),
        nodeThickAvg: document.getElementById("node-thick-avg"),
        lineThickAvg: document.getElementById("line-thick-avg"),
        opacAvg: document.getElementById("opac-avg"),
        opacVar: document.getElementById("opac-var"),
      };

      const colorBg = document.getElementById("color-bg");
      const colorNode = document.getElementById("color-node");
      const btnRegen = document.getElementById("btn-regen");
      const btnDownload = document.getElementById("btn-download");

      let nodes = [];

      function randomNormal(mean, stdDev) {
        let u = 0,
          v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        const num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        return num * stdDev + mean;
      }

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result
          ? {
              r: parseInt(result[1], 16),
              g: parseInt(result[2], 16),
              b: parseInt(result[3], 16),
            }
          : { r: 255, g: 255, b: 255 };
      }

      function generateNodes() {
        nodes = [];
        const count = parseInt(inputs.count.value);
        const posVar = parseFloat(inputs.posVar.value);
        const nodeThickAvg = parseFloat(inputs.nodeThickAvg.value);
        const opacAvg = parseFloat(inputs.opacAvg.value);
        const opacVar = parseFloat(inputs.opacVar.value);

        const baseCenterX = SIZE / 2;
        const baseCenterY = SIZE / 2;

        for (let i = 0; i < count; i++) {
          const x = randomNormal(baseCenterX, posVar);
          const y = randomNormal(baseCenterY, posVar);
          const thickness = Math.max(
            1,
            randomNormal(nodeThickAvg, nodeThickAvg / 2)
          );

          let opacity = randomNormal(opacAvg, opacVar);
          opacity = Math.max(0.0, Math.min(1.0, opacity));

          nodes.push({ x, y, thickness, opacity });
        }
      }

      function draw() {
        // Canvas内をクリア
        ctx.clearRect(0, 0, SIZE, SIZE);

        // 画面確認用の背景色はCSS（bodyの背景）にのみ適用
        document.documentElement.style.setProperty("--bg-color", colorBg.value);

        const rgbNode = hexToRgb(colorNode.value);
        const distMax = parseFloat(inputs.distMax.value);
        const lineThickAvg = parseFloat(inputs.lineThickAvg.value);

        // 接続を描画
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const nodeA = nodes[i];
            const nodeB = nodes[j];
            const dx = nodeA.x - nodeB.x;
            const dy = nodeA.y - nodeB.y;
            const distSq = dx * dx + dy * dy;

            if (distSq < distMax * distMax) {
              ctx.beginPath();
              ctx.moveTo(nodeA.x, nodeA.y);
              ctx.lineTo(nodeB.x, nodeB.y);
              const opacity = Math.min(nodeA.opacity, nodeB.opacity);
              ctx.strokeStyle = `rgba(${rgbNode.r}, ${rgbNode.g}, ${rgbNode.b}, ${opacity})`;
              ctx.lineWidth = Math.max(
                0.5,
                randomNormal(lineThickAvg, lineThickAvg / 2)
              );
              ctx.stroke();
            }
          }
        }

        // ノードを描画
        nodes.forEach((node) => {
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.thickness / 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${rgbNode.r}, ${rgbNode.g}, ${rgbNode.b}, ${node.opacity})`;
          ctx.fill();
        });
      }

      function updateLabels() {
        document.getElementById("count-val").innerText = inputs.count.value;
        document.getElementById("dist-max-val").innerText =
          inputs.distMax.value;
        document.getElementById("pos-var-val").innerText = inputs.posVar.value;
        document.getElementById("node-thick-avg-val").innerText =
          inputs.nodeThickAvg.value + " px";
        document.getElementById("line-thick-avg-val").innerText =
          inputs.lineThickAvg.value + " px";
        document.getElementById("opac-avg-val").innerText =
          inputs.opacAvg.value;
        document.getElementById("opac-var-val").innerText =
          inputs.opacVar.value;
      }

      // ダウンロード処理
      function downloadCanvas() {
        // canvasの内容を透過データ(image/png)のURLに変換
        const link = document.createElement("a");
        link.download = "node_connections_transparent.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      Object.values(inputs).forEach((input) => {
        input.addEventListener("input", () => {
          updateLabels();
          generateNodes();
          draw();
        });
      });

      // 変更をリアルタイム反映
      colorBg.addEventListener("input", draw);
      colorNode.addEventListener("input", draw);
      btnRegen.addEventListener("click", () => {
        generateNodes();
        draw();
      });

      // ダウンロードボタンのバインド
      btnDownload.addEventListener("click", downloadCanvas);

      // 初期セットアップ
      updateLabels();
      generateNodes();
      draw();
    </script>
  </body>
</html>
